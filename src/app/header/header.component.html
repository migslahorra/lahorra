<mat-toolbar color="primary">
    <span>Post and Create!</span>
    <span class="spacer"></span>
    <nav>
      <ul>
        <li *ngIf = "userIsAuthenticated">  
          <a mat-button routerLink = "/post-create" routerLinkActive = "mat-accent"> New Post</a>  
        </li>
        <li *ngIf = "userIsAuthenticated">
          <a mat-button routerLink="/post-list" routerLinkActive="active">Manage Posts List</a>
        </li>
        <li *ngIf = "!userIsAuthenticated">  
          <a mat-button routerLink = "/login" routerLinkActive = "mat-accent">Login</a>  
        </li>  
        <li *ngIf = "!userIsAuthenticated">  
          <a mat-button routerLink = "/signup" routerLinkActive = "mat-accent">Signup</a>  
        </li>  
        <li *ngIf = "userIsAuthenticated">  
          <button mat-button (click)= "onLogout()">Logout</button>  
        </li>  
      </ul>
    </nav>
  </mat-toolbar>
